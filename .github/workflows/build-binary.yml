name: Build Binary

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: colab-mcp
            asset_name: colab-mcp-linux-amd64
          - os: ubuntu-24.04-arm
            artifact_name: colab-mcp
            asset_name: colab-mcp-linux-arm64
          - os: windows-latest
            artifact_name: colab-mcp.exe
            asset_name: colab-mcp-windows-amd64.exe
          - os: macos-latest
            artifact_name: colab-mcp
            asset_name: colab-mcp-macos-amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: |
          uv sync
          uv pip install pyinstaller

      - name: Create launcher script
        shell: bash
        run: |
          cat > launcher.py <<'EOF'
          from colab_mcp import main
          if __name__ == '__main__':
              main()
          EOF
      
      - name: Build binary with PyInstaller
        shell: bash
        run: |
          uv run pyinstaller --onefile \
            --name ${{ matrix.artifact_name }} \
            --paths src \
            --collect-submodules colab_mcp \
            --collect-all fastmcp \
            --collect-all docket \
            --collect-all fakeredis \
            --collect-all key_value \
            --collect-all redis \
            --collect-all mcp \
            --collect-all jupyter_kernel_client \
            --collect-all jupyter_client \
            --collect-submodules lupa \
            --hidden-import=lupa.lua51 \
            --collect-all lupa \
            --collect-data certifi \
            --hidden-import=colab_mcp.session \
            --hidden-import=uvicorn.logging \
            --hidden-import=uvicorn.loops.auto \
            --hidden-import=uvicorn.loops.asyncio \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=uvicorn.protocols.http.h11_impl \
            --hidden-import=uvicorn.protocols.websockets.auto \
            --hidden-import=uvicorn.protocols.websockets.websockets_impl \
            --hidden-import=uvicorn.lifespan.on \
            --hidden-import=anyio._backends._asyncio \
            --hidden-import=websockets.legacy \
            --hidden-import=websockets.legacy.client \
            launcher.py

      - name: Smoke test binary
        shell: bash
        run: |
          uv run python .github/smoke_test.py "dist/${{ matrix.artifact_name }}"

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error